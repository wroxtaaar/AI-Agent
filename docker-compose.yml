services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      AGENT_MEMORY_DB: /data/agent_memory.db
      AGENT_PROPOSAL_DIR: /runtime/proposals
      AGENT_TRACE_FILE: /runtime/agent_trace.log
    volumes:
      # Project source is mounted at /workspace so diagnostics and approved edits
      # can operate on the VPS filesystem through the existing safety boundary.
      - ${HOME}:/workspace:rw
      # Docker CLI access is required by the Docker inspection tools.
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/data
      - agent-runtime:/runtime
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import healthcheck; healthcheck.main()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  agent-data:
  agent-runtime:
