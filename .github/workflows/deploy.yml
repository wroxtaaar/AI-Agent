name: Deploy AI Agent

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ai-agent-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile agent.py model.py config.py tools/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --tag ai-agent:test .

  deploy:
    name: Deploy to Oracle VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            cd "$HOME/ai-agent"

            echo "== Repository state =="
            git status --short --branch

            echo "== Updating repository =="
            git fetch origin master
            git merge --ff-only origin/master

            echo "== Compiling Python sources =="
            .venv/bin/python -m py_compile agent.py model.py config.py tools/*.py

            echo "== Running tests =="
            .venv/bin/python -m unittest discover -s tests -v

            echo "== Checking Docker =="
            docker version
            docker compose version

            echo "== Building and starting AI Agent =="
            docker compose up -d --build --remove-orphans

            echo "== Waiting for container health =="
            healthy=false
            for attempt in $(seq 1 12); do
              status="$(docker inspect --format '{{.State.Health.Status}}' ai-agent 2>/dev/null || true)"
              echo "Health attempt $attempt: ${status:-unknown}"

              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi

              if [ "$status" = "unhealthy" ]; then
                docker compose logs --tail=100 ai-agent || true
                exit 1
              fi

              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              docker compose logs --tail=100 ai-agent || true
              exit 1
            fi

            echo "== Container status =="
            docker compose ps

            echo "== Deployment complete =="
            git log -1 --oneline
