name: Agent Tests

on:
  push:
    branches: ["master", "v13-vps-control-plane"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile agent.py model.py config.py ai_provider.py agent_runtime.py server.py run_server.py tools/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
